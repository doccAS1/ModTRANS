name: Build Windows executable

# Run it by hand (Actions tab -> "Build Windows executable" -> Run workflow) to get the zip as a
# downloadable artifact, or publish a GitHub Release and the zip is attached to it automatically.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # needed only to attach the zip to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      # The tests import the package as "modtrans"; in this repo the folder is "modtrans_pub".
      # Informational: a failure here is shown but does not block the build.
      - name: Run tests
        continue-on-error: true
        shell: pwsh
        run: |
          Copy-Item ModTrans_Source/modtrans_pub ./modtrans -Recurse
          python -m modtrans.tests.test_core

      - name: Build ModTrans.exe
        run: python -m pyinstaller --noconfirm --clean --distpath dist --workpath build ModTrans_Source/modtrans.spec

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist/ModTrans.exe release/
          Copy-Item ModTrans_Source/config.example.toml release/config.toml
          Copy-Item README.md release/README.md
          Compress-Archive -Path release/* -DestinationPath ModTrans-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ModTrans-windows
          path: ModTrans-windows.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ModTrans-windows.zip --clobber
