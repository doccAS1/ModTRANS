name: Build SkyrimTrans for Windows

# Run it by hand (Actions tab -> "Build SkyrimTrans for Windows" -> Run workflow) to get the zip
# as a downloadable artifact. It also runs on pull requests that touch ModTrans_Skyrim/.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ModTrans_Skyrim/**"
      - ".github/workflows/build-skyrim-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ModTrans_Skyrim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest ".[anthropic,7z]"

      # Informational: a failure is shown but does not block the build.
      - name: Run tests
        continue-on-error: true
        run: python -m pytest -q tests

      - name: Build SkyrimTrans.exe
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build skyrimtrans.spec

      # Imports are checked here: if a bundled library is missing, this fails.
      - name: Smoke test
        run: ./dist/SkyrimTrans.exe --help

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist/SkyrimTrans.exe release/
          Copy-Item README.md release/README.md
          Compress-Archive -Path release/* -DestinationPath SkyrimTrans-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SkyrimTrans-windows
          path: ModTrans_Skyrim/SkyrimTrans-windows.zip
