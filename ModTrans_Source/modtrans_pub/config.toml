# ============================================================================
#  modtrans configuration
# ============================================================================

# --- General settings -------------------------------------------------------
game       = "stardew"       # which game adapter to use (only "stardew" for now)
workdir    = "~/.modtrans"   # dove salvare backup e memorie (es. "C:/Users/tuonome/modtrans-data")
batch_size = 65              # stringhe per richiesta

# ============================================================================
#  ENGINES
# ============================================================================

# --- Translator: does the actual translation --------------------------------
[translator]
type = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-6-luna"
api_key_env = "OPEN_ROUTER_API_KEY"

